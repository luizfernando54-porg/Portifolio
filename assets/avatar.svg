<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fba16c" />
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2f" />
      <stop offset="100%" stop-color="#0f0f17" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#6366f1" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Aura -->
  <rect width="400" height="400" rx="40" fill="#0d1117"/>
  <circle cx="200" cy="200" r="170" fill="url(#bgGrad)" opacity="0.25"/>
  <circle cx="200" cy="190" r="140" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Developer Character Silhouette / Art -->
  <g transform="translate(0, 10)">
    <!-- Shoulders / Hoodie -->
    <path d="M90 350 C 90 280, 140 240, 200 240 C 260 240, 310 280, 310 350 Z" fill="url(#hoodieGrad)" />
    <path d="M165 242 L 200 295 L 235 242 Z" fill="#2d3748" />
    <!-- Hoodie Strings / Accent -->
    <line x1="185" y1="260" x2="185" y2="310" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <line x1="215" y1="260" x2="215" y2="310" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>

    <!-- Neck -->
    <rect x="175" y="195" width="50" height="50" rx="10" fill="url(#skinGrad)"/>

    <!-- Head -->
    <circle cx="200" cy="155" r="55" fill="url(#skinGrad)"/>

    <!-- Hair -->
    <path d="M145 150 C 145 95, 255 95, 255 150 C 255 125, 235 110, 200 110 C 165 110, 145 130, 145 150 Z" fill="#18181b"/>
    <path d="M142 155 C 138 130, 160 100, 200 95 C 240 100, 262 130, 258 155 C 250 135, 235 120, 200 120 C 165 120, 150 135, 142 155 Z" fill="#27272a"/>

    <!-- Smart Glasses / Tech Specs -->
    <rect x="160" y="142" width="32" height="22" rx="6" fill="#090d16" stroke="#38bdf8" stroke-width="3"/>
    <rect x="208" y="142" width="32" height="22" rx="6" fill="#090d16" stroke="#38bdf8" stroke-width="3"/>
    <line x1="192" y1="152" x2="208" y2="152" stroke="#38bdf8" stroke-width="3"/>
    <!-- Glass Reflections -->
    <line x1="164" y1="146" x2="175" y2="158" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="212" y1="146" x2="223" y2="158" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- Beard / Smile -->
    <path d="M188 182 Q 200 190 212 182" stroke="#475569" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Headphones -->
    <path d="M138 150 C 138 110, 262 110, 262 150" fill="none" stroke="#6366f1" stroke-width="8" stroke-linecap="round"/>
    <rect x="132" y="140" width="16" height="32" rx="8" fill="#38bdf8"/>
    <rect x="252" y="140" width="16" height="32" rx="8" fill="#38bdf8"/>
  </g>

  <!-- Decorative Tech Floating Badges -->
  <g transform="translate(45, 65)">
    <circle cx="20" cy="20" r="22" fill="#1e1e2f" stroke="#6366f1" stroke-width="2"/>
    <text x="20" y="26" fill="#38bdf8" font-size="16" font-family="monospace" font-weight="bold" text-anchor="middle">&lt;/&gt;</text>
  </g>
  <g transform="translate(310, 85)">
    <circle cx="20" cy="20" r="22" fill="#1e1e2f" stroke="#ec4899" stroke-width="2"/>
    <text x="20" y="27" fill="#ec4899" font-size="18" font-family="sans-serif" font-weight="bold" text-anchor="middle">⚡</text>
  </g>
  <g transform="translate(290, 280)">
    <circle cx="20" cy="20" r="22" fill="#1e1e2f" stroke="#10b981" stroke-width="2"/>
    <text x="20" y="27" fill="#10b981" font-size="18" font-family="sans-serif" font-weight="bold" text-anchor="middle">🚀</text>
  </g>
</svg>
