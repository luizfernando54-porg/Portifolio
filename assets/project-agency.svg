<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAgency" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="cube1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="cube2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#bgAgency)"/>

  <!-- Agency Landing Page Frame -->
  <g transform="translate(50, 40)">
    <rect width="700" height="420" rx="12" fill="#09090b" stroke="#27272a" stroke-width="1.5"/>
    
    <!-- Top Nav -->
    <rect width="700" height="45" rx="12" fill="#18181b"/>
    <text x="35" y="28" fill="#ffffff" font-size="15" font-weight="900" font-family="sans-serif">LUMINA<tspan fill="#ec4899"> STUDIO</tspan></text>
    
    <text x="320" y="28" fill="#f4f4f5" font-size="11" font-family="sans-serif">Trabalhos</text>
    <text x="400" y="28" fill="#a1a1aa" font-size="11" font-family="sans-serif">Metodologia</text>
    <text x="490" y="28" fill="#a1a1aa" font-size="11" font-family="sans-serif">Prêmios Awwwards</text>
    
    <rect x="585" y="10" width="85" height="25" rx="12" fill="url(#textGrad)"/>
    <text x="627" y="26" fill="#ffffff" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">Novo Briefing</text>

    <!-- Main Hero Center -->
    <g transform="translate(40, 80)">
      <rect x="0" y="0" width="160" height="24" rx="12" fill="#27272a"/>
      <text x="12" y="16" fill="#ec4899" font-size="10" font-weight="bold" font-family="sans-serif">★ DIGITAL DESIGN AGENCY OF THE YEAR</text>

      <text x="0" y="65" fill="#ffffff" font-size="34" font-weight="900" font-family="sans-serif">Criamos experiências</text>
      <text x="0" y="105" fill="url(#textGrad)" font-size="34" font-weight="900" font-family="sans-serif">digitais inesquecíveis.</text>

      <text x="0" y="140" fill="#a1a1aa" font-size="12" font-family="sans-serif">Desenvolvimento Web 3D, WebGL interativo e interfaces futuristas de alto impacto.</text>
      
      <rect x="0" y="170" width="140" height="40" rx="20" fill="url(#textGrad)"/>
      <text x="70" y="195" fill="#ffffff" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">Explorar Cases ➔</text>
    </g>

    <!-- 3D Geometric Floating Shapes Visual -->
    <g transform="translate(480, 110)">
      <!-- Isometric Cube Top -->
      <polygon points="100,50 160,80 100,110 40,80" fill="#a855f7"/>
      <!-- Cube Left -->
      <polygon points="40,80 100,110 100,180 40,150" fill="url(#cube1)"/>
      <!-- Cube Right -->
      <polygon points="100,110 160,80 160,150 100,180" fill="url(#cube2)"/>

      <!-- Floating Ring -->
      <ellipse cx="100" cy="115" rx="80" ry="30" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="10 5" opacity="0.8"/>
    </g>

    <!-- Bottom Clients Bar -->
    <g transform="translate(40, 340)">
      <rect width="620" height="50" rx="8" fill="#18181b" stroke="#27272a"/>
      <text x="25" y="30" fill="#71717a" font-size="11" font-family="sans-serif">CLIENTES DE DESTAQUE:</text>
      <text x="190" y="30" fill="#ffffff" font-size="13" font-weight="bold" font-family="sans-serif" letter-spacing="2">SPOTIFY</text>
      <text x="310" y="30" fill="#ffffff" font-size="13" font-weight="bold" font-family="sans-serif" letter-spacing="2">VERCEL</text>
      <text x="430" y="30" fill="#ffffff" font-size="13" font-weight="bold" font-family="sans-serif" letter-spacing="2">SUPABASE</text>
      <text x="560" y="30" fill="#ffffff" font-size="13" font-weight="bold" font-family="sans-serif" letter-spacing="2">LINEAR</text>
    </g>
  </g>
</svg>
