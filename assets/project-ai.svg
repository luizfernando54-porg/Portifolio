<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="neuralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#bgAI)"/>

  <!-- AI Studio UI Window -->
  <g transform="translate(50, 40)">
    <rect width="700" height="420" rx="12" fill="#181824" stroke="#4c1d95" stroke-width="1.5"/>
    
    <!-- Top Nav -->
    <rect width="700" height="45" rx="12" fill="#0f0f17"/>
    <circle cx="25" cy="22" r="5" fill="#ef4444"/>
    <circle cx="45" cy="22" r="5" fill="#f59e0b"/>
    <circle cx="65" cy="22" r="5" fill="#10b981"/>
    <text x="100" y="27" fill="#c084fc" font-size="14" font-weight="bold" font-family="sans-serif">SYNAPSE<tspan fill="#f43f5e">.AI</tspan> • Neural Agents &amp; Workflow Studio</text>
    
    <rect x="560" y="10" width="120" height="24" rx="12" fill="url(#neuralGrad)"/>
    <text x="620" y="26" fill="#ffffff" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">✨ Modelo v4.5 Ativo</text>

    <!-- Chat/Canvas Area -->
    <!-- Prompt Node 1 -->
    <g transform="translate(40, 70)">
      <rect width="280" height="90" rx="10" fill="#1e1e2f" stroke="#6366f1" stroke-width="1.5"/>
      <text x="15" y="25" fill="#a5b4fc" font-size="11" font-weight="bold" font-family="sans-serif">🤖 Agente de Pesquisa Autônomo</text>
      <text x="15" y="48" fill="#e2e8f0" font-size="11" font-family="sans-serif">"Analise 50 repositórios e extraia métricas de vulnerabilidade e performance."</text>
      <rect x="15" y="65" width="60" height="16" rx="4" fill="#312e81"/>
      <text x="45" y="77" fill="#818cf8" font-size="9" text-anchor="middle">Python SDK</text>
    </g>

    <!-- Connector Line -->
    <path d="M 320 115 L 380 115 L 380 200 L 420 200" fill="none" stroke="#ec4899" stroke-width="2" stroke-dasharray="4 4"/>

    <!-- Neural Model Node 2 -->
    <g transform="translate(420, 150)">
      <rect width="240" height="110" rx="10" fill="#1e1e2f" stroke="#ec4899" stroke-width="1.5"/>
      <text x="15" y="25" fill="#f472b6" font-size="11" font-weight="bold" font-family="sans-serif">🧠 Processamento LLM / RAG</text>
      <text x="15" y="48" fill="#e2e8f0" font-size="11" font-family="sans-serif">Vetorização e embeddings em banco Qdrant / Pinecone</text>
      <text x="15" y="70" fill="#10b981" font-size="10" font-family="sans-serif">● 4.200 tokens processados / s</text>
      <rect x="15" y="82" width="70" height="16" rx="4" fill="#831843"/>
      <text x="50" y="94" fill="#f472b6" font-size="9" text-anchor="middle">LangChain</text>
    </g>

    <!-- Output Code Terminal Box -->
    <g transform="translate(40, 200)">
      <rect width="340" height="190" rx="10" fill="#09090e" stroke="#2e2e48" stroke-width="1"/>
      <rect width="340" height="28" rx="10" fill="#14141e"/>
      <text x="15" y="18" fill="#94a3b8" font-size="10" font-family="monospace">terminal_output.py</text>

      <text x="15" y="50" fill="#38bdf8" font-size="11" font-family="monospace">from</text>
      <text x="50" y="50" fill="#f1f5f9" font-size="11" font-family="monospace">synapse_ai</text>
      <text x="135" y="50" fill="#38bdf8" font-size="11" font-family="monospace">import</text>
      <text x="185" y="50" fill="#fcd34d" font-size="11" font-family="monospace">Agent, Pipeline</text>

      <text x="15" y="75" fill="#64748b" font-size="11" font-family="monospace"># Inicializa pipeline com streaming</text>
      <text x="15" y="95" fill="#f1f5f9" font-size="11" font-family="monospace">pipeline = Pipeline(model="v4.5-pro")</text>
      <text x="15" y="115" fill="#f1f5f9" font-size="11" font-family="monospace">stream = pipeline.execute(task=query)</text>
      
      <text x="15" y="145" fill="#10b981" font-size="11" font-family="monospace">&gt;&gt; Conexão estabelecida (100% OK)</text>
      <text x="15" y="165" fill="#ec4899" font-size="11" font-family="monospace">&gt;&gt; Insights gerados com sucesso.</text>
    </g>

    <!-- Interactive Prompt Bar at bottom -->
    <g transform="translate(400, 310)">
      <rect width="260" height="80" rx="10" fill="#141420" stroke="#3730a3" stroke-width="1"/>
      <text x="15" y="25" fill="#cbd5e1" font-size="11" font-family="sans-serif">Envie uma instrução para a IA...</text>
      <rect x="15" y="40" width="230" height="28" rx="6" fill="url(#neuralGrad)"/>
      <text x="130" y="58" fill="#ffffff" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">Gerar Análise Completa ⚡</text>
    </g>
  </g>
</svg>
