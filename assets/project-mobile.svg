<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMob" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#bgMob)"/>

  <!-- Left Phone Mockup -->
  <g transform="translate(180, 45)">
    <!-- Phone Body -->
    <rect width="200" height="410" rx="30" fill="#0f172a" stroke="#38bdf8" stroke-width="3" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.6))"/>
    <rect x="10" y="10" width="180" height="390" rx="22" fill="#0284c7"/>
    
    <!-- Dynamic Island / Notch -->
    <rect x="65" y="18" width="70" height="18" rx="9" fill="#0f172a"/>

    <!-- Screen Content -->
    <text x="25" y="65" fill="#ffffff" font-size="14" font-weight="bold" font-family="sans-serif">PulseFit 🏃‍♂️</text>
    
    <!-- Activity Ring Area -->
    <circle cx="100" cy="140" r="45" fill="none" stroke="#0369a1" stroke-width="8"/>
    <circle cx="100" cy="140" r="45" fill="none" stroke="#38bdf8" stroke-width="8" stroke-dasharray="200 80" stroke-linecap="round"/>
    <text x="100" y="137" fill="#ffffff" font-size="16" font-weight="bold" font-family="sans-serif" text-anchor="middle">8.420</text>
    <text x="100" y="152" fill="#bae6fd" font-size="9" font-family="sans-serif" text-anchor="middle">Passos Hoje</text>

    <!-- Workout Cards -->
    <rect x="20" y="210" width="160" height="50" rx="10" fill="#0369a1"/>
    <text x="32" y="232" fill="#ffffff" font-size="11" font-weight="bold" font-family="sans-serif">🔥 Corrida Matinal</text>
    <text x="32" y="248" fill="#bae6fd" font-size="9" font-family="sans-serif">5.2 km • 420 kcal • 28 min</text>

    <rect x="20" y="270" width="160" height="50" rx="10" fill="#0369a1"/>
    <text x="32" y="292" fill="#ffffff" font-size="11" font-weight="bold" font-family="sans-serif">💪 Treino HIIT</text>
    <text x="32" y="308" fill="#bae6fd" font-size="9" font-family="sans-serif">45 min • Frequência 142 bpm</text>

    <!-- Bottom Tab Bar -->
    <rect x="10" y="350" width="180" height="50" rx="15" fill="#075985"/>
    <text x="45" y="380" fill="#38bdf8" font-size="16" text-anchor="middle">🏠</text>
    <text x="100" y="380" fill="#ffffff" font-size="16" text-anchor="middle">📈</text>
    <text x="155" y="380" fill="#ffffff" font-size="16" text-anchor="middle">👤</text>
  </g>

  <!-- Right Phone Mockup (Detail View) -->
  <g transform="translate(420, 45)">
    <rect width="200" height="410" rx="30" fill="#0f172a" stroke="#0ea5e9" stroke-width="3" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.6))"/>
    <rect x="10" y="10" width="180" height="390" rx="22" fill="#0c4a6e"/>
    <rect x="65" y="18" width="70" height="18" rx="9" fill="#0f172a"/>

    <text x="25" y="65" fill="#ffffff" font-size="13" font-weight="bold" font-family="sans-serif">Qualidade do Sono 🌙</text>

    <!-- Sleep Chart Bars -->
    <g transform="translate(20, 95)">
      <rect x="10" y="50" width="14" height="40" rx="3" fill="#38bdf8"/>
      <rect x="32" y="30" width="14" height="60" rx="3" fill="#38bdf8"/>
      <rect x="54" y="20" width="14" height="70" rx="3" fill="#7dd3fc"/>
      <rect x="76" y="10" width="14" height="80" rx="3" fill="#38bdf8"/>
      <rect x="98" y="25" width="14" height="65" rx="3" fill="#38bdf8"/>
      <rect x="120" y="15" width="14" height="75" rx="3" fill="#7dd3fc"/>
      <rect x="142" y="35" width="14" height="55" rx="3" fill="#38bdf8"/>
    </g>

    <rect x="20" y="220" width="160" height="75" rx="10" fill="#075985"/>
    <text x="32" y="245" fill="#38bdf8" font-size="10" font-weight="bold" font-family="sans-serif">PONTUAÇÃO DE RECUPERAÇÃO</text>
    <text x="32" y="275" fill="#ffffff" font-size="24" font-weight="bold" font-family="sans-serif">94<tspan font-size="12" fill="#38bdf8"> /100 Excelente</tspan></text>

    <!-- Start Workout Button -->
    <rect x="20" y="315" width="160" height="42" rx="12" fill="#38bdf8"/>
    <text x="100" y="341" fill="#082f49" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">Sincronizar Relógio ⌚</text>
  </g>
</svg>
